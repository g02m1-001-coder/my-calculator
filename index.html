<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เครื่องคิดเลขวิทยาศาสตร์</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #ced7d7;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .calculator {
            background-color: #222;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0px 10px 30px rgba(0,0,0,0.3);
            width: 350px; /* Widened slightly */
        }

        #display {
            width: 100%;
            height: 60px;
            font-size: 1.8rem;
            text-align: right;
            margin-bottom: 15px;
            padding: 10px;
            box-sizing: border-box;
            border: none;
            background: #333;
            color: #fff;
            border-radius: 10px;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            height: 50px;
            font-size: 1.2rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s;
            background-color: #444;
            color: white;
        }

        button:hover { background-color: #555; }

        /* Scientific Button Style */
        .sci {
            background-color: #5e5e5e;
            font-style: italic;
            font-size: 1rem;
        }

        .operator { background-color: #ff9500; }
        .operator:hover { background-color: #e68600; }

        .clear { background-color: #ff3b30; }
        .clear:hover { background-color: #d32f2f; }

        .equal {
            background-color: #34c759;
            grid-column: span 2;
        }
        .equal:hover { background-color: #28a745; }
    </style>
</head>
<body>

<div class="calculator">
    <input type="text" id="display" placeholder="0" disabled>
    
    <div class="buttons">
        <button class="sci" onclick="calculateSci('sin')">sin</button>
        <button class="sci" onclick="calculateSci('cos')">cos</button>
        <button class="sci" onclick="calculateSci('tan')">tan</button>
        <button class="clear" onclick="clearDisplay()">C</button>

        <button onclick="appendToDisplay('(')">(</button>
        <button onclick="appendToDisplay(')')">)</button>
        <button onclick="appendToDisplay('**')">xʸ</button>
        <button class="operator" onclick="appendToDisplay('/')">/</button>

        <button onclick="appendToDisplay('7')">7</button>
        <button onclick="appendToDisplay('8')">8</button>
        <button onclick="appendToDisplay('9')">9</button>
        <button class="operator" onclick="appendToDisplay('*')">×</button>

        <button onclick="appendToDisplay('4')">4</button>
        <button onclick="appendToDisplay('5')">5</button>
        <button onclick="appendToDisplay('6')">6</button>
        <button class="operator" onclick="appendToDisplay('-')">-</button>

        <button onclick="appendToDisplay('1')">1</button>
        <button onclick="appendToDisplay('2')">2</button>
        <button onclick="appendToDisplay('3')">3</button>
        <button class="operator" onclick="appendToDisplay('+')">+</button>

        <button onclick="appendToDisplay('0')">0</button>
        <button onclick="appendToDisplay('.')">.</button>
        <button class="equal" onclick="calculate()">=</button>
    </div>
</div>

<script>
    const display = document.getElementById('display');

    function appendToDisplay(input) {
        display.value += input;
    }

    function clearDisplay() {
        display.value = "";
    }

    // Function for basic math
    function calculate() {
        try {
            // Using Function() instead of eval() is slightly safer
            display.value = new Function('return ' + display.value)();
        } catch (error) {
            display.value = "Error";
        }
    }

    // Function for Sin, Cos, Tan (Converts Degrees to Radians)
    function calculateSci(func) {
        try {
            const degrees = parseFloat(display.value);
            if (isNaN(degrees)) {
                display.value = "Error";
                return;
            }
            
            const radians = degrees * (Math.PI / 180);
            let result;

            if (func === 'sin') result = Math.sin(radians);
            if (func === 'cos') result = Math.cos(radians);
            if (func === 'tan') result = Math.tan(radians);

            // Rounding to 8 decimal places to avoid 0.99999999
            display.value = Number(result.toFixed(8));
        } catch (error) {
            display.value = "Error";
        }
    }
</script>

</body>
</html>
